name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:          - 'war_game_2d_android_project_ready.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack game project
        run: unzip -q war_game_2d_android_project.zip -d source

      - name: Build debug APK
        working-directory: source/war_game_2d
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahmat-Survival-APK
          path: source/war_game_2d/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
