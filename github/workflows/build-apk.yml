name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'war_game_2d_android_project_ready.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack game project
        run: |
          unzip -q war_game_2d_android_project_ready.zip -d source
          echo "Extracted project files:"
          find source -maxdepth 4 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) -print

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        run: |
          find source -name settings.gradle -o -name settings.gradle.kts

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(dirname "$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
          find . -path '*/build/outputs/apk/debug/*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahmat-Survival-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
